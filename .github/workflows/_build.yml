on:
  workflow_call:
    inputs:
      environment:
        required: false
        description: Deployment environment
        type: string
        default: staging
      version:
        required: false
        description: The version for build
        type: string
        default: latest
      source:
        required: true
        description: The source package path (e.g., apps/web)
        type: string
      image-name:
        required: true
        description: Docker image name
        type: string
      dockerfile:
        required: false
        description: The dockerfile path relative to source
        type: string
        default: Dockerfile
      context:
        required: false
        description: The dockerfile build context
        type: string
        default: .
      build-args:
        required: false
        description: Build arguments to pass to Docker
        type: string
        default: ""
      extra-tag:
        required: false
        description: Additional image tag to push
        type: string
        default: ""
      docker-repository:
        required: false
        description: Docker registry repository URL
        type: string
        default: ""

jobs:
  docker:
    runs-on: self-hosted
    concurrency:
      group: ${{ github.event.repository.name }}-docker-${{ github.ref_name }}-${{ inputs.image-name }}
      cancel-in-progress: true
    env:
      APP_NAME: ${{ github.event.repository.name }}
      APP_ENV: ${{ inputs.environment }}
      APP_VERSION: ${{ inputs.version }}
      BUILDKIT_PROGRESS: plain
      DOCKER_REPOSITORY: ${{ inputs.docker-repository || format('dcr.bndigital.dev/{0}', github.event.repository.name) }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Generate .env file
        uses: bn-digital/vault-env@latest
        continue-on-error: true
        with:
          endpoint: ${{ secrets.VAULT_ENDPOINT }}
          token: ${{ secrets.GH_TOKEN }}
          template: ${{ inputs.source }}/.env.${{ env.APP_ENV }}.tpl
          target: ${{ inputs.source }}/.env

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REPOSITORY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build tags
        id: tags
        run: |
          TAGS="${{ env.DOCKER_REPOSITORY }}/${{ inputs.image-name }}:${{ env.APP_VERSION }}"
          if [ -n "${{ inputs.extra-tag }}" ]; then
            TAGS="${TAGS},${{ env.DOCKER_REPOSITORY }}/${{ inputs.image-name }}:${{ inputs.extra-tag }}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          file: ./${{ inputs.source }}/${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=registry,ref=${{ env.DOCKER_REPOSITORY }}/${{ inputs.image-name }}:cache
          cache-to: type=registry,ref=${{ env.DOCKER_REPOSITORY }}/${{ inputs.image-name }}:cache,mode=max
